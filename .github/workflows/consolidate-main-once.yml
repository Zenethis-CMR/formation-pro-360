name: One-time main consolidation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/consolidate-main-once.yml']
permissions:
  contents: write
concurrency:
  group: one-time-main-consolidation
  cancel-in-progress: false
jobs:
  consolidate:
    if: github.repository == 'Zenethis-CMR/formation-pro-360' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify audited branch tips, preserve history and atomically remove branches
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          test "$base" = "$GITHUB_SHA"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse refs/remotes/origin/main)" = "$base"
          cat > "$RUNNER_TEMP/audited-branches" <<'AUDITED'
          feat/supabase-auth-db 84a34b34f328faf30ff826eedfb33108474909cd
          feat/premium-ui-dashboard fc6f2350aa965ce2d4a91047f42ecc45175a7daf
          feat/pro-typography-lucide 51289b2f8294cd256e19fee7524e5fe83c9babbd
          feat/learning-experience-polish 1388799c2d58b52207eaaaff9e5aff20639a5541
          feat/live-supabase-platform 38a0cc7c183b276ec1284510b717592009cb403e
          feat/pedagogical-coaching 877424e08bab98099ea0a884441c620d7ee21e4e
          feat/learning-coach-alerts c8266677b799bdb40273eab4f35271c844e8f721
          fix/workshop-production-readiness 62cff12d764e20bfaccda0908d5b82077d6d1703
          feat/authentication-signup-password 92976b0503a9b5b8f157cef38fab124b0a52aa63
          feat/learner-welcome-onboarding 59ec5a5bb06a0a534953e6633bbdbc39ed1523fc
          feat/unify-real-workspaces-with-demo 259ffb9c902d08dbe38d5a50a77f8fcc601b6958
          feat/private-role-based-workspaces 984817fb07f86de86f7fdd7d7f659fbe03292a04
          feat/intensive-360-onboarding-and-roadmap 408d09026d73bdcef5e9cf4f810c4a3c903be4b6
          feat/v2-auth-performance-and-account-security b2bce184961734996ffa5011086b5872d9869430
          feat/v2-a2-tab-queries-20261123 4c6fb5cd220a5dbaa12f743c0cc861175c74f5c2
          feat/v2-b1-trainer-preview-20261123 ce5975f7d4a1feed9250b9e467ce96df8942f802
          fix/learner-studio-recovery-ux 565d151d9f20d7bfcb40b3a2e937f9f250d17318
          feat/learner-personal-week ad195133ac643c3f132a4401419210ac241b4b6e
          feat/learner-entry-diagnostic 0ddd8681575cdceda65fce40fd0c42384e7dfbb1
          feat/learner-product-project 375ec0e58af90a1557df6683928d6058b22cd602
          feat/product-backlog 4998d47388c0b7498e234453b610401cb78b027a
          feat/human-led-product-assistance 0b95ff93b1128a1070a16eff301426bc2e4b2659
          feat/product-coach-domains-trainer-cockpit 8d5c60f84d96e8e3e010450b77015ace9bf99fd5
          feat/practical-sessions dfc970cba10f5aa86c9053332c324d8b44d40f62
          feat/personal-practice-briefs 5932ed8c2986676ba288fd95d124c5c3ec7f888e
          feat/learner-support-center 28b9f0b34f4b855e17b71a60550199f40a2d4a42
          feat/collaborative-project-review e6089a1cbc892e666b2ea98e139044251dca6718
          feat/advanced-learning-reports 3c2c0105305828922826bbe8957427bca8cce90a
          feat/advanced-learning-reports-integrated d16f1c09e3e2e9d8f68b6d9448718944677eebc5
          feat/dashboard-experience-v3 a4e184213f0d5a61e4571e4baa8bb2cdd71a25bc
          feat/hero-first-workspace 639c4febbd38f2bd8f1b30bd72c5afa379560bdf
          feat/learner-dashboard-v4 916822eb56551abe38919f8a24cfdd23f8a38be2
          feat/fullscreen-learning-studio 7589be56940c9e9f19d788c58eef8ee3c9e90cd8
          feat/product-workspace-v3 f0d66f9320943503cb3785fc2b550b462c7daa34
          feat/onboarding-experience-360 890afabd1761e1d97c4d6ffcd284ca75f65ba632
          feat/workspace-motion-feedback b826c14fb4baffbc872d7f07e569b08206a0a32f
          feat/dashboard-visual-polish-v5 9f2651c298c2dea1d3fb3ff19e31786d56c2a465
          fix/wider-workspace-sidebars 2b27ab53071a497006bc8f298c8f09ac400142aa
          AUDITED
          git ls-remote --heads origin | awk '{sub(/^refs\/heads\//,"",$2); if($2!="main") print $2" "$1}' | sort > "$RUNNER_TEMP/live-branches"
          sort "$RUNNER_TEMP/audited-branches" > "$RUNNER_TEMP/expected-branches"
          diff -u "$RUNNER_TEMP/expected-branches" "$RUNNER_TEMP/live-branches"
          parents=(-p "$base")
          leases=("--force-with-lease=refs/heads/main:$base")
          deletes=()
          while read -r branch sha; do
            test "$branch" != main
            test "$(git rev-parse "refs/remotes/origin/$branch")" = "$sha"
            if ! git merge-base --is-ancestor "$sha" "$base"; then
              parents+=(-p "$sha")
            fi
            leases+=("--force-with-lease=refs/heads/$branch:$sha")
            deletes+=(":refs/heads/$branch")
          done < "$RUNNER_TEMP/expected-branches"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree="$(git rev-parse "$base^{tree}")"
          new="$(git commit-tree "$tree" "${parents[@]}" -m 'chore(git): preserve audited branch histories on main without reverting integrated code')"
          test "$(git rev-parse "$new^{tree}")" = "$tree"
          while read -r branch sha; do
            git merge-base --is-ancestor "$sha" "$new"
          done < "$RUNNER_TEMP/expected-branches"
          git push --atomic "${leases[@]}" origin "$new:refs/heads/main" "${deletes[@]}"
          test "$(git ls-remote --heads origin | awk '{print $2}')" = refs/heads/main
          echo "Verified: main is the only remaining branch."
