name: Deploy Formation Pro 360

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: formation-pro-360-hosted-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - name: Report CT410 pipeline start
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --silent --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=formation/ct410-deploy -f description="Validation and deployment running" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm run test:unit

      - name: Type check
        run: npm run lint

      - name: Build standalone frontend
        env:
          NEXT_PUBLIC_SITE_URL: https://formation.zenithis.tech
        run: |
          node ./node_modules/next/dist/bin/next build
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -a public .next/standalone/public; fi
          mkdir -p .next/standalone/deploy
          cp deploy/cleanup.sh .next/standalone/deploy/cleanup.sh
          cp deploy/formation-pro-360.service .next/standalone/deploy/formation-pro-360.service
          tar -czf "$RUNNER_TEMP/formation-pro-360.tar.gz" -C .next/standalone .

      - name: Install isolated browser acceptance dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-qa" --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/browser-qa/node_modules/.bin/playwright" install --with-deps chromium

      - name: Browser acceptance (public and synthetic authenticated workspaces)
        env:
          BROWSER_QA_OUTPUT: browser-qa
        run: NODE_PATH="$RUNNER_TEMP/browser-qa/node_modules" node scripts/browser-acceptance.cjs

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: browser-qa/
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure production SSH
        env:
          DEPLOY_KEY: ${{ secrets.FORMATION_PRO_DEPLOY_KEY }}
        run: |
          set -eu
          umask 077
          mkdir -p ~/.ssh
          test -n "$DEPLOY_KEY" || { echo "Missing FORMATION_PRO_DEPLOY_KEY"; exit 1; }
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/formation-pro-deploy
          cat >> ~/.ssh/known_hosts <<'HOSTS'
          136.243.58.44 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMs67EFwyMCvS8uMJ7QnJ2ZRTPA8HOkDT0IpiYvXQB72
          10.0.0.41 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDA8+NV2mxXAkK2R6BrQ+VNQQG0+qFPIKuwoLDrX8kno
          HOSTS
          cat >> ~/.ssh/config <<'CONFIG'
          Host 136.243.58.44 10.0.0.41
            IdentityFile ~/.ssh/formation-pro-deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          Host 10.0.0.41
            ProxyJump root@136.243.58.44
          CONFIG

      - name: Check production configuration on CT 410
        run: |
          set -euo pipefail
          key="$HOME/.ssh/formation-pro-deploy"
          host="formation360@10.0.0.41"
          ssh -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes "$host" 'bash -s' <<'REMOTE'
          set -euo pipefail
          file=/etc/formation-pro-360/frontend.env
          test -s "$file" || { echo "Frontend runtime configuration is missing; fill deploy/frontend.env.example on CT 410." >&2; exit 1; }
          grep -q '^FORMATION_API_INTERNAL_URL=http://10.0.0.42:3000$' "$file" || { echo "FORMATION_API_INTERNAL_URL must point to CT 420 port 3000." >&2; exit 1; }
          grep -q '^NEXT_PUBLIC_SITE_URL=https://formation.zenithis.tech$' "$file" || { echo "NEXT_PUBLIC_SITE_URL must point to the public frontend domain." >&2; exit 1; }
          if grep -Eq 'example-project|change_me|localhost|JWT|SECRET|PASSWORD|TOKEN|KEY=' "$file"; then
            echo "Frontend runtime configuration may contain a secret or sample value." >&2
            exit 1
          fi
          REMOTE

      - name: Release to CT 410
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          key="$HOME/.ssh/formation-pro-deploy"
          host="formation360@10.0.0.41"
          ssh -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes "$host" "mkdir -p /opt/formation-pro-360/releases/$RELEASE_ID"
          scp -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes "$RUNNER_TEMP/formation-pro-360.tar.gz" "$host:/opt/formation-pro-360/releases/$RELEASE_ID/release.tar.gz"
          ssh -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes "$host" "bash -s -- '$RELEASE_ID'" <<'REMOTE'
          set -euo pipefail
          release_id="$1"
          app=/opt/formation-pro-360
          cd "$app/releases/$release_id"
          tar -xzf release.tar.gz
          rm release.tar.gz
          previous="$(readlink -f "$app/current" 2>/dev/null || true)"
          sudo -n install -m 0644 "$app/releases/$release_id/deploy/formation-pro-360.service" /etc/systemd/system/formation-pro-360.service
          sudo -n systemctl daemon-reload
          ln -s "$app/releases/$release_id" "$app/current-$release_id"
          mv -Tf "$app/current-$release_id" "$app/current"
          if ! sudo -n systemctl restart formation-pro-360.service; then
            if [ -n "$previous" ]; then
              sudo -n install -m 0644 "$previous/deploy/formation-pro-360.service" /etc/systemd/system/formation-pro-360.service
              sudo -n systemctl daemon-reload
              ln -s "$previous" "$app/current-rollback"
              mv -Tf "$app/current-rollback" "$app/current"
              sudo -n systemctl restart formation-pro-360.service || true
            fi
            exit 1
          fi
          curl --retry 15 --retry-connrefused --retry-delay 2 --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
          # Ensure both V2 public catalog routes really serve rendered content,
          # without logging personal information or requiring auth.
          catalog_html="$(mktemp)"
          course_html="$(mktemp)"
          trap 'rm -f "$catalog_html" "$course_html"' EXIT
          curl --retry 5 --retry-connrefused --retry-delay 2 --fail --silent --show-error http://127.0.0.1:3000/catalogue -o "$catalog_html"
          curl --retry 5 --retry-connrefused --retry-delay 2 --fail --silent --show-error http://127.0.0.1:3000/catalogue/ingenierie-produit-ia -o "$course_html"
          grep -Fq 'Les formations 360' "$catalog_html" || { echo "V2 catalog content check failed." >&2; exit 1; }
          grep -Fq 'Interroger les utilisateurs' "$course_html" || { echo "V2 course details check failed." >&2; exit 1; }
          echo "V2 public catalog and program verified on CT410."
          # Cross-tab anonymous route guards. Private learner views must not
          # become anonymously accessible after a navigation or layout change.
          for protected_path in \
            /espace/apprenant \
            '/espace/apprenant?onglet=missions' \
            '/espace/apprenant?onglet=progression' \
            '/espace/apprenant?onglet=programme' \
            /espace/parcours/ingenierie-produit-ia \
            /espace/bienvenue \
            /espace/compte \
            /espace/portfolio \
            /espace/atelier/00000000-0000-4000-8000-000000000000; do
            code="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' "http://127.0.0.1:3000$protected_path")"
            case "$code" in
              302|303|307|308|401|403) ;;
              *) echo "Learner private route exposed or broken: $protected_path, HTTP $code" >&2; exit 1 ;;
            esac
          done
          echo "All learner tabs, account, objectives, course and portfolio require authentication."
          # All 16 detailed studios must refuse requests without a learner session.
          # This is a live HTTP smoke test, not a substitute for DB authorization.
          studio_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/espace/parcours/ingenierie-produit-ia/atelier/valider-probleme)"
          case "$studio_code" in
            302|303|307|308|401|403) echo "V2 private studio correctly requires an authenticated session." ;;
            *) echo "V2 studio security smoke failed: unexpected HTTP $studio_code." >&2; exit 1 ;;
          esac
          # No owner publication settings may be read without an authenticated learner.
          share_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:3000/api/portfolio-publication)"
          test "$share_code" = 401 || { echo "Portfolio share settings exposed without session: $share_code" >&2; exit 1; }
          # Invalid public capability must be non-sensitive and must not redirect to login.
          public_html="$(mktemp)"
          curl --retry 5 --retry-connrefused --retry-delay 2 --fail --silent --show-error \
            http://127.0.0.1:3000/p/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA -o "$public_html"
          grep -Fq "Ce portfolio n" "$public_html" && grep -Fq "est plus accessible." "$public_html" || {
            rm -f "$public_html"
            echo "Public share not-found page is missing or reveals a protected page." >&2
            exit 1
          }
          rm -f "$public_html"
          echo "Anonymous portfolio settings and invalid share link verified on CT410."
          # The slow local AI route must refuse unauthenticated POSTs immediately.
          # This is an HTTP auth smoke, not a real learner inference test.
          coach_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'Origin: https://formation.zenithis.tech' \
            -H 'Content-Type: application/json' \
            --data '{"lessonId":"00000000-0000-4000-8000-000000000000","question":"Comment vérifier mon atelier ?"}' \
            http://127.0.0.1:3000/api/coach)"
          test "$coach_status" = 401 || { echo "Private coach route exposed without session: $coach_status" >&2; exit 1; }
          bash "$app/current/deploy/cleanup.sh"
          REMOTE

      - name: Report CT410 pipeline result
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          case "$JOB_RESULT" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          gh api --silent --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=formation/ct410-deploy -f description="CT410 pipeline: $JOB_RESULT" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
